<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="MahjongCalm — offline mahjong solitaire with original geometric tiles. Match free tiles, clear calm layouts." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MahjongCalm</title>
    <link rel="stylesheet" href="/css/meta.css" />
  </head>
  <body>
    <div id="app">
      <!-- HOME -->
      <section class="screen" data-screen="home">
        <div class="panel home-panel">
          <div class="logo-mark" aria-hidden="true">◈</div>
          <h1 class="logo">MahjongCalm</h1>
          <p class="tagline">Match free geometric tiles. Clear calm layouts offline.</p>
          <p class="progress-line">Layouts cleared: <strong id="home-progress">0 / 12</strong></p>
          <button type="button" class="btn primary" id="btn-play">Play</button>
          <button type="button" class="btn secondary" id="btn-layouts">Choose layout</button>
          <button type="button" class="btn ghost" id="btn-settings">Settings</button>
        </div>
      </section>

      <!-- LAYOUT SELECT -->
      <section class="screen" data-screen="layouts" hidden>
        <div class="panel levels-panel">
          <header class="subhead">
            <button type="button" class="icon-btn" id="btn-layouts-back" aria-label="Back">←</button>
            <h2>Layouts</h2>
          </header>
          <div id="layout-grid" class="level-grid"></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="screen" data-screen="settings" hidden>
        <div class="panel">
          <header class="subhead">
            <button type="button" class="icon-btn" id="btn-settings-back" aria-label="Back">←</button>
            <h2>Settings</h2>
          </header>
          <button type="button" class="btn secondary block" id="btn-mute">🔊 Sound on</button>
          <p class="hint-text">Original geometric tiles. Plays fully offline. v0.2.0</p>
          <div class="settings-end"></div>
        </div>
      </section>

      <!-- PLAY -->
      <section class="screen" data-screen="play" hidden>
        <header class="hud">
          <button type="button" class="icon-btn" id="btn-menu" aria-label="Menu">⌂</button>
          <div class="hud-stat"><span class="lbl">Layout</span><span id="hud-layout">—</span></div>
          <div class="hud-stat"><span class="lbl">Left</span><span id="hud-left">0</span></div>
          <div class="hud-stat"><span class="lbl">Moves</span><span id="hud-moves">0</span></div>
          <button type="button" class="icon-btn hint-btn" id="btn-hint" aria-label="Hint" title="Hints: 3 free left">
            <span class="hint-icon" aria-hidden="true">💡</span>
            <span class="hint-stock" id="hud-hints">Hints: 3 free left</span>
          </button>
        </header>
        <div class="board-wrap">
          <canvas id="board" width="400" height="480" aria-label="Mahjong board"></canvas>
        </div>
        <div class="play-bar">
          <button type="button" class="btn secondary" id="btn-shuffle">Shuffle</button>
          <button type="button" class="btn secondary" id="btn-undo" aria-label="Undo last match" title="Undo last match" disabled>Undo</button>
          <button type="button" class="btn secondary" id="btn-redo" aria-label="Redo last undone match" title="Redo last undone match" disabled>Redo</button>
          <button type="button" class="btn secondary" id="btn-retry">Retry</button>
          <button type="button" class="btn ghost" id="btn-play-layouts">Layouts</button>
        </div>

        <div id="overlay-win" class="overlay" hidden>
          <div class="panel" role="dialog" aria-modal="true" aria-labelledby="win-title" tabindex="-1">
            <h2 id="win-title">Cleared!</h2>
            <p class="go-meta" id="win-meta">All tiles matched. Calm mind.</p>
            <button type="button" class="btn primary" id="btn-next">Next layout</button>
            <button type="button" class="btn secondary" id="btn-win-share">Share</button>
            <button type="button" class="btn secondary" id="btn-win-replay">Replay</button>
            <button type="button" class="btn secondary" id="btn-win-layouts">Layout select</button>
            <button type="button" class="btn ghost" id="btn-win-home">Home</button>
          </div>
        </div>

      </section>

      <div id="toast" class="toast" hidden role="status"></div>

      <div id="a2hs" class="a2hs" hidden>
        <span>Install MahjongCalm: browser menu → <strong>Add to Home Screen</strong></span>
        <button type="button" id="a2hs-ok" class="btn tiny">OK</button>
      </div>
    </div>
    <div id="meta-toast" aria-live="polite" aria-atomic="true"></div>
    <script src="/js/sr.js"></script>
    <script src="/js/a11y.js"></script>
    <script src="/js/shopcore.js"></script>
    <script src="/js/ads-config.js"></script>
    <script src="/js/adgate.js"></script>
    <script src="/js/ads.js"></script>
    <script src="/js/cloud-config.js"></script>
    <script src="/js/daily.js"></script>
    <script src="/js/achievements.js"></script>
    <script src="/js/coach.js"></script>
    <script src="/js/review.js"></script>
    <script src="/js/ach-defs.js"></script>
    <script src="/js/metakit.js"></script>
    <script src="/js/meta-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
